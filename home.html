<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kaliuscripted | Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <canvas id="particlesCanvas"></canvas>

    <!-- Header Minimal -->
    <header class="main-header">
        <button id="menuToggle" class="menu-btn">
            <i class="fas fa-bars"></i>
        </button>
        <div class="logo">
            <i class="fas fa-terminal"></i>
            <span>KALIUSCRIPTED</span>
        </div>
        <div class="header-right">
            <div class="user-badge-mini">
                <span id="userInitialsMini">DV</span>
                <button id="logoutMiniBtn" class="logout-icon-mini">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Sidebar TABS Melhorada -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-cube"></i>
                <span>MENU</span>
            </div>
            <button id="closeSidebar" class="close-sidebar">&times;</button>
        </div>

        <nav class="sidebar-nav">
            <a href="home.html" class="nav-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="library.html" class="nav-item">
                <i class="fas fa-book-open"></i>
                <span>Library</span>
            </a>
        </nav>

        <!-- User Viewer no final da sidebar -->
        <div class="sidebar-user-footer">
            <div class="user-avatar-footer" id="sidebarAvatarFooter">DV</div>
            <div class="user-info-footer">
                <span class="user-name-footer" id="sidebarUsernameFooter">Dev</span>
                <span class="user-status-footer">Online</span>
            </div>
        </div>
    </aside>

    <div id="overlay" class="overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div id="homePage" class="page active fade-in">
            <div class="welcome-card">
                <h1>Welcome, <span id="welcomeName">Dev</span></h1>
                <p>Educational JavaScript library for browser-based scripting experiments.</p>
            </div>
            
            <div class="stats-card">
                <div class="stat-item">
                    <h2>6</h2>
                    <span>Scripts</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Educational</span>
                </div>
            </div>
        </div>
    </main>

    <div id="notificationContainer" class="notification-container"></div>

    <script src="script.js"></script>
</body>
</html>
