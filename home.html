<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kaliuscripted | Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <canvas id="particlesCanvas"></canvas>

    <!-- Header -->
    <div class="app-header">
        <button id="menuBtn" class="menu-button">
            <i class="fas fa-bars"></i>
        </button>
        <div class="app-logo">
            <i class="fas fa-terminal"></i>
            <span>KALIUSCRIPTED</span>
        </div>
        <div class="app-user">
            <div class="user-avatar" id="headerAvatar">DV</div>
            <button id="logoutHeaderBtn" class="logout-button">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand">
                <i class="fas fa-cube"></i>
                <span>MENU</span>
                <button id="closeSidebarBtn" class="sidebar-close">&times;</button>
            </div>
            <nav class="sidebar-nav">
                <a href="home.html" class="nav-link active">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="library.html" class="nav-link">
                    <i class="fas fa-book"></i>
                    <span>Library</span>
                </a>
            </nav>
        </div>
        <div class="sidebar-user">
            <div class="user-avatar-lg" id="sidebarAvatar">DV</div>
            <div class="user-details">
                <span class="user-name" id="sidebarName">Dev</span>
                <span class="user-status">● Online</span>
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay"></div>

    <!-- Main Content -->
    <main class="main-container">
        <div class="welcome-section">
            <h1>Welcome back, <span id="welcomeUser">Dev</span></h1>
            <p>Educational JavaScript library for browser automation experiments.</p>
        </div>
        
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value">6</div>
                <div class="stat-label">Total Scripts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">2</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-value"><i class="fas fa-graduation-cap"></i></div>
                <div class="stat-label">Educational</div>
            </div>
        </div>

        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <p>This library contains automation scripts for educational platforms. Use responsibly.</p>
        </div>
    </main>

    <div id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
