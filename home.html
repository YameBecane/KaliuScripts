<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Home | Kaliuscripted</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Particles */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Header macOS Style */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.3px;
        }

        .logo i {
            color: #007aff;
            margin-right: 6px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #007aff;
        }

        .logout-icon {
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
            padding: 4px;
            border-radius: 6px;
        }

        .logout-icon:hover {
            opacity: 1;
            background: rgba(255, 59, 48, 0.1);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 48px;
            left: -260px;
            width: 260px;
            height: calc(100% - 48px);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-right: 0.5px solid rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
            z-index: 99;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 16px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: #888;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .nav-link i {
            width: 20px;
            font-size: 16px;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .nav-link.active {
            background: rgba(0, 122, 255, 0.15);
            color: #007aff;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #007aff;
        }

        .sidebar-user-info {
            flex: 1;
        }

        .sidebar-user-name {
            display: block;
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar-user-status {
            font-size: 11px;
            color: #34c759;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 98;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Main Content */
        .main {
            position: fixed;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 32px 40px;
            overflow-y: auto;
            transition: left 0.3s;
        }

        .sidebar.open ~ .main {
            left: 260px;
        }

        /* Welcome Section */
        .welcome {
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.08), rgba(0, 0, 0, 0));
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 28px;
            border: 0.5px solid rgba(0, 122, 255, 0.2);
        }

        .welcome h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .welcome h1 span {
            color: #007aff;
        }

        .welcome p {
            color: #888;
            font-size: 14px;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: rgba(30, 30, 35, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #007aff;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        /* Info Box */
        .info-box {
            background: rgba(30, 30, 35, 0.4);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .info-box i {
            font-size: 20px;
            color: #007aff;
        }

        .info-box p {
            font-size: 13px;
            color: #888;
        }

        /* Scroll */
        .main::-webkit-scrollbar {
            width: 5px;
        }
        .main::-webkit-scrollbar-track {
            background: transparent;
        }
        .main::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 56px;
            right: 20px;
            z-index: 1000;
        }
        .toast {
            background: rgba(30, 30, 35, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 18px;
            margin-bottom: 8px;
            font-size: 13px;
            animation: slideIn 0.3s ease;
            border-left: 3px solid;
        }
        .toast.success { border-left-color: #34c759; }
        .toast.error { border-left-color: #ff3b30; }
        .toast.info { border-left-color: #007aff; }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .main { padding: 20px; }
            .stats { grid-template-columns: 1fr; }
            .welcome h1 { font-size: 22px; }
            .sidebar.open ~ .main { left: 0; }
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="header">
        <button id="menuBtn" class="menu-btn"><i class="fas fa-bars"></i></button>
        <div class="logo"><i class="fas fa-terminal"></i> KALIUSCRIPTED</div>
        <div class="user-area">
            <div class="user-avatar" id="headerAvatar">DV</div>
            <button id="logoutBtn" class="logout-icon"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-nav">
            <a href="home.html" class="nav-link active">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="library.html" class="nav-link">
                <i class="fas fa-book"></i> Library
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-avatar" id="sidebarAvatar">DV</div>
            <div class="sidebar-user-info">
                <span class="sidebar-user-name" id="sidebarName">Dev</span>
                <span class="sidebar-user-status">● Online</span>
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay"></div>

    <main class="main">
        <div class="welcome">
            <h1>Welcome, <span id="welcomeUser">Dev</span></h1>
            <p>Educational JavaScript library for browser automation experiments.</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">6</div>
                <div class="stat-label">Total Scripts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">2</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-number"><i class="fas fa-graduation-cap"></i></div>
                <div class="stat-label">Educational</div>
            </div>
        </div>

        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <p>This library contains automation scripts for educational platforms. Use responsibly.</p>
        </div>
    </main>

    <div id="toast"></div>

    <script>
        // Particles
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createParticles() {
            particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    speedX: (Math.random() - 0.5) * 0.2,
                    speedY: (Math.random() - 0.5) * 0.15,
                    opacity: Math.random() * 0.2
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 122, 255, ${p.opacity})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            createParticles();
        });
        resizeCanvas();
        createParticles();
        animateParticles();

        // Auth check
        if (sessionStorage.getItem('loggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        const username = sessionStorage.getItem('username') || 'Dev';
        const initials = username.substring(0, 2).toUpperCase();

        document.getElementById('headerAvatar').textContent = initials;
        document.getElementById('sidebarAvatar').textContent = initials;
        document.getElementById('sidebarName').textContent = username;
        document.getElementById('welcomeUser').textContent = username;

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? '✓' : type === 'error' ? '✗' : '●';
            toast.innerHTML = `<span style="font-weight:600;margin-right:8px">${icon}</span>${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Sidebar
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuBtn.onclick = () => {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        };

        overlay.onclick = () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        };

        // Logout
        document.getElementById('logoutBtn').onclick = () => {
            sessionStorage.removeItem('loggedIn');
            sessionStorage.removeItem('username');
            showToast('Logged out successfully', 'info');
            setTimeout(() => { window.location.href = 'login.html'; }, 500);
        };

        showToast(`Welcome back, ${username}!`, 'success');
    </script>
</body>
</html>
