<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kaliuscripted | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <canvas id="particlesCanvas"></canvas>

    <div class="login-overlay">
        <div class="login-card">
            <div class="login-brand">
                <i class="fas fa-terminal"></i>
                <h1>KALIU<span>SCRIPTED</span></h1>
                <p>educational scripts library</p>
            </div>
            
            <form id="loginForm">
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Username" autocomplete="off">
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password">
                </div>
                <button type="submit" id="loginBtn">ACCESS <i class="fas fa-arrow-right"></i></button>
            </form>
            
            <div class="login-social">
                <a href="#" id="discordBtn"><i class="fab fa-discord"></i></a>
                <a href="#" id="youtubeBtn"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
