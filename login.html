<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login | Kaliuscripted</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Particles */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 340px;
            padding: 20px;
        }

        .login-card {
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 28px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .login-icon {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-icon i {
            font-size: 42px;
            color: #007aff;
        }

        .login-card h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #007aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .login-card p {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group input {
            width: 100%;
            background: rgba(30, 30, 35, 0.8);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: #007aff;
            background: rgba(40, 40, 45, 0.9);
        }

        .input-group input::placeholder {
            color: #555;
        }

        .login-btn {
            width: 100%;
            background: #007aff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: #0051d5;
            transform: translateY(-1px);
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .social-btn {
            width: 38px;
            height: 38px;
            background: rgba(30, 30, 35, 0.8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background: #007aff20;
            color: #007aff;
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            background: rgba(30, 30, 35, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            animation: slideIn 0.3s ease;
            border-left: 3px solid;
        }

        .toast.success { border-left-color: #34c759; }
        .toast.error { border-left-color: #ff3b30; }
        .toast.info { border-left-color: #007aff; }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="login-container">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-terminal"></i>
            </div>
            <h1>Kaliuscripted</h1>
            <p>educational scripts library</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password">
                </div>
                <button type="submit" class="login-btn">Access Library →</button>
            </form>
            
            <div class="social-row">
                <a href="#" id="discordBtn" class="social-btn"><i class="fab fa-discord"></i></a>
                <a href="#" id="youtubeBtn" class="social-btn"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        // Particles
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createParticles() {
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.2,
                    opacity: Math.random() * 0.3
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 122, 255, ${p.opacity})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            createParticles();
        });
        resizeCanvas();
        createParticles();
        animateParticles();

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? '✓' : type === 'error' ? '✗' : '●';
            toast.innerHTML = `<span style="font-weight:600">${icon}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Login
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (username === 'Dev' && password === '86271415') {
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', username);
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => { window.location.href = 'home.html'; }, 600);
            } else {
                showToast('Invalid credentials. Try: Dev / 86271415', 'error');
                document.getElementById('password').value = '';
            }
        });

        document.getElementById('discordBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.open('https://discord.gg/kaliuscripted', '_blank');
        });
        document.getElementById('youtubeBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.open('https://youtube.com/@kaliuscripted', '_blank');
        });
    </script>
</body>
</html>
